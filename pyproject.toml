[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "somolier"
version = "0.1.0"
description = "Fail-closed ingestion and normalization codec with a pluggable packet backend"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Rook Services Inc."}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
somolier = "somolier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
